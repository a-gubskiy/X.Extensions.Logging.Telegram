name: CLA

# Fails the pull request until its author checks the CLA box from the pull request template.
# Pull requests from the repository owner and from bots (Dependabot) are skipped.

on:
  pull_request:
    types: [ opened, edited, reopened, synchronize ]

permissions:
  contents: read

jobs:
  cla:
    if: github.event.pull_request.user.type != 'Bot' && github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Check CLA acceptance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if printf '%s\n' "$PR_BODY" | grep -qiE '^[[:space:]]*[-*] \[x\] I have read the \[Contributor License Agreement\]'; then
            echo "@$PR_AUTHOR accepted the Contributor License Agreement."
          else
            echo "::error::Please read CLA.md and check the Contributor License Agreement box in the pull request description."
            exit 1
          fi
