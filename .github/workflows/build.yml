name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build X.Extensions.Logging.Telegram.slnx -c Release

      - name: Test
        run: dotnet test --solution X.Extensions.Logging.Telegram.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/X.Extensions.Logging.Telegram/X.Extensions.Logging.Telegram.csproj -c Release --no-build -o artifacts

  publish:
    # Publishes to NuGet via Trusted Publishing when a GitHub Release is published.
    # The package version is taken from the release tag (v3.0.0 -> 3.0.0).
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Get version from tag
        id: version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Pack
        run: >
          dotnet pack src/X.Extensions.Logging.Telegram/X.Extensions.Logging.Telegram.csproj
          -c Release
          -o artifacts
          -p:Version=${{ steps.version.outputs.version }}
          -p:ContinuousIntegrationBuild=true

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: andrey-gubskiy

      - name: Push to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
